[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-dw"
version = "0.1.0"
description = "Coffee Chains data warehousing course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.40,<2",
  "plotly>=5.20,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
sqlserver = ["pyodbc>=5,<6"]

[project.scripts]
coffee-dw = "coffee_dw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
